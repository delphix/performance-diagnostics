# Configuration for delphix-influxdb-init.
# Sourced by /usr/bin/delphix-influxdb-init at runtime.
#

# Write-once: set at first initialization and cannot be changed on an existing
# install without wiping /var/lib/influxdb and reinitializing from scratch.
INFLUXDB_ORG="delphix"
INFLUXDB_BUCKET="default"
INFLUXDB_SUPPORT_BUCKET="support_metrics"

# Reconciled on every run: changes here take effect on the next invocation of
# delphix-influxdb-init (e.g. after a package upgrade or a manual re-run).
INFLUXDB_RETENTION_SECONDS=2592000       # 30 days
INFLUXDB_SUPPORT_RETENTION_SECONDS=2592000 # 30 days

# Readiness check: wait up to RETRIES * INTERVAL seconds for InfluxDB to start.
INFLUXDB_WAIT_RETRIES=30
INFLUXDB_WAIT_INTERVAL=2
